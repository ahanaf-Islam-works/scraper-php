services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres-db
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
    pg_data:
